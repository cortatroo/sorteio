<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Frases</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Sorteador de Frases</h1>
    </header>

    <main class="container">
        
        <!-- Cartão do Sorteio -->
        <section class="card highlight-card">
            <div id="loading-state" class="center-content">
                <div class="spinner"></div>
                <p>Sincronizando...</p>
            </div>

            <div id="app-content" style="display: none;">
                <div class="result-box">
                    <span id="resultado-id" class="badge hidden"></span>
                    <h2 id="resultado-frase">Pronto para o próximo sorteio?</h2>
                    <p id="resultado-data" class="date-text"></p>
                </div>
                
                <button id="btn-sortear" class="btn btn-primary" onclick="realizarSorteio()">SORTEAR</button>
            </div>
        </section>

        <!-- Progresso -->
        <section class="card">
            <h3>Progresso do Ciclo</h3>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="progress-stats">
                <span id="stat-sorteadas">0 sorteadas</span>
                <span id="stat-percentual">0%</span>
                <span id="stat-restantes">0 restantes</span>
            </div>
        </section>

        <!-- Histórico -->
        <section class="card">
            <h3>Histórico de Sorteios</h3>
            <ul id="lista-historico" class="history-list">
                <!-- Preenchido via JS -->
            </ul>
        </section>

        <!-- Botão Reset -->
        <div class="reset-container">
            <button id="btn-reset" class="btn btn-outline" onclick="reiniciarCiclo()">REINICIAR CICLO</button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
